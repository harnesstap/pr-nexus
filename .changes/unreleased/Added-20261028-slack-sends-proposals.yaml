kind: Added
body: Agents can propose Slack messages, scheduled messages, drafts and reactions through the local MCP server. Each one waits in Settings → Agents until you approve it, except in channels you list for auto-send; auto-send pauses when the agent read another workspace first. Slack sends is off by default and Slack's replies and errors come back unchanged.
