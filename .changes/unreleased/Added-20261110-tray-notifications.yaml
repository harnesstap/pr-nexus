kind: Added
body: Closing the window leaves PR Nexus in the menu bar. The icon shows how many pull requests need attention, and the menu lists To review and Mine, Refresh, and Quit. Desktop notifications cover a new review request, CI turning red, an approval, and changes requested; new review threads stay off until enabled. The first sync after launch stays quiet, and a denied notification permission is a grey note in Settings.
