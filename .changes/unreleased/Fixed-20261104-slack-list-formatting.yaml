kind: Fixed
body: 'Review requests and bumps with several pull requests now show every item as a bullet on its own line in Slack. Before, the first item was glued to the line above with a stray "*". List markers ("- " or "* ") are sent as "•", including in custom templates and notes, so Slack matches the preview.'
