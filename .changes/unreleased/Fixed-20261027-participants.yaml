kind: Fixed
body: "The generic Participants and Reviewers sections are replaced by one inline row of up to four groups, in order: Author (hidden when it's you), Reviewers (with their status ring, including pending code-owner teams), Assignees, and Commenters (PR and review-thread comment authors, without you or anyone already shown). Empty groups are hidden, each group stacks avatars with +N, and bots are marked in tooltips. Previously the list missed the author and bots and could read \"No one yet\" on a commented PR."
