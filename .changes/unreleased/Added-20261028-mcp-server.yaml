kind: Added
body: 'Settings → Agents (MCP): an opt-in local MCP server so AI agents on your computer can list and read your projects and pull requests (statuses, notes, stars, Slack requests). It listens on 127.0.0.1 only, needs a bearer token kept in the keychain (copy or regenerate it in Settings), rejects foreign Host and Origin headers, and starts or stops without a restart. Local writes and Slack sends are coming next.'
