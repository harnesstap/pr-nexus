kind: Changed
body: "PR list readability: titles keep a minimum width on wide rows (the comment count collapses first, then the Slack text), and rows switch to a compact layout when the detail panel is open or the list is narrow: the title wraps over two lines with the full title in a tooltip, repo and CI sit under it, the review status becomes a colored dot, Slack an icon with the last send or bump time (\"2h\"), comments an icon and count, and reviewer avatars move to the detail panel. Rows show Draft and Conflicts pills and an age chip when a PR has waited on review over 48h or been idle for 7 days. New sorts \"Waiting longest\" and \"Last bumped\" sit in a toolbar sort picker. The active quick filter shows its label, a \"Clear filters\" button appears when any filter is on, the comment counter hides at zero and reads unresolved/total, the list gets extra bottom room while a selection is active, and the Unassigned header lines up with project headers. Empty views show a single message (\"No reviews requested from you\", or \"No open PRs in your tracked orgs\" with a link to Settings) and To review no longer lists empty project groups. Clicking anywhere on a row opens (or switches) the detail panel; the checkbox, links, avatars and menus keep their own behaviour, and selecting text or dragging a row does not open it."
