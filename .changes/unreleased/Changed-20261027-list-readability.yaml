body: "PR list readability: titles keep a minimum width and rows switch to a compact two-line layout when the detail panel is open or the window is narrow (comment count collapses first, then the Slack text). Rows show Draft and Conflicts pills and an age chip when a PR has waited on review over 48h or been idle for 7 days. New sorts \"Waiting longest\" and \"Last bumped\" sit in a toolbar sort picker. The active quick filter shows its label, a \"Clear filters\" button appears when any filter is on, the comment counter hides at zero and reads unresolved/total, the list gets extra bottom room while a selection is active, and the Unassigned header lines up with project headers. Empty views show a single message (\"No reviews requested from you\", or \"No open PRs in your tracked orgs\" with a link to Settings) and To review no longer lists empty project groups."
