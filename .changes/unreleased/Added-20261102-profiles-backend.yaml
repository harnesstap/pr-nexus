kind: Added
body: 'Profiles: keep separate GitHub accounts, Slack workspaces, projects, templates, send policy and activity side by side, and switch between them. Your current setup becomes the default profile (a backup of the old database is kept). MCP tools act on the active profile and take an optional `profile`; `list_profiles` lists them.'
