body: 'With PRs selected and the detail panel open, the selection bar no longer slides under the panel. It stays centered in the list and, when space runs out, folds Add to project and Copy as Markdown into a "…" More menu, then shortens the count and the Slack button. Clear and the Slack button stay visible, shortcuts still work, and toasts follow the bar.'
