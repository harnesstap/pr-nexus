kind: Added
body: "Add to project in the selection bar (`p`): pick a project or create one from the selection in a single step, with a confirmation toast and the project highlighted in the sidebar. The sidebar's new-project field can take the current selection too. Buttons now carry icons, icon-only buttons have tooltips with a short explanation and their shortcut, dialogs close with an ✕, and text fields no longer spellcheck, autocorrect or autocapitalize."
