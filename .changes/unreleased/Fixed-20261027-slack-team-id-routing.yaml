kind: Fixed
body: Route Slack sends by workspace team ID instead of domain, so a channel link carrying an Enterprise Grid org host no longer picks the wrong workspace. Workspaces can be turned off and ordered in Settings → Slack; new requests fall back to the next enabled workspace when Slack says the channel or person is not there, and the picker searches all enabled workspaces at once.
