body: "Each PR row shows avatars of the users and teams that still have to review, users first then teams in a fixed order, with a \"+N\" chip past three and a tooltip listing everyone. Names and avatars come with the sync (no extra request) and are stored in the local database; a reviewer drops off on the next sync after they submit."
