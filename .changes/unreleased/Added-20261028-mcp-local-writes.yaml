kind: Added
body: 'Settings → Agents (MCP): Local writes can now be turned on. Agents can then create, rename, archive and unarchive projects (never delete), add or remove PRs, set JIRA links, and set notes and stars; the list refreshes right away. A new Activity log shows every agent call (time, client, tool, summary, allowed / denied / error), keeps the last 5,000 calls for up to 90 days, never stores note text, and can be filtered or cleared. Slack sends are still coming.'
