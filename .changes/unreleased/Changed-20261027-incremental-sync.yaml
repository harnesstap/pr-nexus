body: 'Sync is now incremental: between full passes it asks GitHub only for pull requests updated since the last sync (with a 5-minute overlap), re-reads checks, reviews and mergeability only for rows still moving (all open rows every 30 minutes), and writes and redraws only rows that changed. A full reconcile still runs at start, every 6 hours, when tracked orgs change, and from Full resync in the sync details. The footer shows how many rows an incremental pass updated.'
