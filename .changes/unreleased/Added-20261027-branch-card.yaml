kind: Added
body: "The detail panel's Conflicts card is now a Branch card: it shows whether the branch is up to date with its base, how many commits behind it is, whether an update is required before merging, conflicts (with Resolve on GitHub), or a spinner while GitHub is still checking. Update branch merges the base in or, after a confirmation that warns when other people committed on the branch, rebases onto it. The behind count is fetched only when the panel opens and cached per head and base commit."
