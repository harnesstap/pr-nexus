kind: Fixed
body: After a team is remapped to another Slack channel, the review preview no longer shows the new channel while bumping the old thread. The default is a new request in the mapped channel with a note on the card, the old thread stays an explicit pick, and the mapping editor warns when a channel name changes but its id does not.
