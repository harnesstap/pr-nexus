kind: Changed
body: "Sync and Settings clarity: a red banner when GitHub sync fails (Reconnect GitHub on a 401, with the age of the data shown), an amber banner when a Slack workspace needs sign-in, with Request review and Bump disabled for it, and a sync popover with labeled rows plus Sync now and Full resync buttons. Settings › Accounts › Slack lists connected workspaces first with switches, priority numbers, drag handles and a prominent Reconnect; the Slack app fields move under \"Slack app (advanced)\", and Add another workspace no longer stays disabled while a client ID is saved. Settings now save through one sticky Save bar shown only with unsaved changes, and every on/off option is a switch. Setup skips the single-choice provider steps (5 steps instead of 7), keeps Connect GitHub disabled until there is input, and explains why behind \"Why is this disabled?\"."
