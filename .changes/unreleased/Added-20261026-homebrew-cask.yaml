kind: Added
body: 'Homebrew install on Apple Silicon Macs: `brew install --cask harnesstap/tap/pr-nexus`. Each published release updates the cask in harnesstap/homebrew-tap. Linux CI jobs for pull requests from forks run on GitHub-hosted runners instead of the self-hosted ones, and `app/package.json` now carries the release version.'
