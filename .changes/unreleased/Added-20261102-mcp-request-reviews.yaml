body: 'MCP tool `request_reviews`: agents can request reviews (or send reminders) on Slack for several PRs at once, with the same messages, grouping and tracking as the app''s batch "Request review on Slack". Sends follow your Slack send policy and confirmation, and `preview: true` shows the messages without sending.'
