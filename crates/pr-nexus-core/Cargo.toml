[package]
name = "pr-nexus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Domain types, errors, and the provider registry for PR-Nexus"

[dependencies]
bitflags = "2"
chrono.workspace = true
# `bundled` only. Default features pull the wasm SQLite backend, which this
# desktop crate does not use.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
