[package]
name = "pr-nexus-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Domain types, errors, and the provider registry for PR-Nexus"

[dependencies]
bitflags = "2"
chrono.workspace = true
csv = "1.4"
regex = "1.13.1"
# `bundled` only. Default features pull the wasm SQLite backend, which this
# desktop crate does not use.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3"
