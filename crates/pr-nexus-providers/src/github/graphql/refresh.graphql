query RefreshPullRequests($ids: [ID!]!) {
  rateLimit {
    limit
    remaining
    resetAt
    cost
  }
  nodes(ids: $ids) {
    ... on PullRequest {
      ...PrFields
    }
  }
}

fragment PrFields on PullRequest {
  id
  number
  title
  url
  bodyText
  isDraft
  state
  createdAt
  updatedAt
  author {
    login
  }
  headRefName
  baseRefName
  headRefOid
  repository {
    id
    owner {
      login
    }
    name
    isArchived
    defaultBranchRef {
      name
    }
  }
  labels(first: 20) {
    nodes {
      name
    }
  }
  reviewDecision
  mergeable
  mergeStateStatus
  commits(last: 1) {
    nodes {
      commit {
        committedDate
        statusCheckRollup {
          state
        }
      }
    }
  }
  reviewRequests(first: 20) {
    nodes {
      requestedReviewer {
        ... on User {
          login
        }
        ... on Team {
          slug
          organization {
            login
          }
        }
      }
    }
  }
  reviewThreads(first: 100) {
    totalCount
    nodes {
      isResolved
    }
  }
}
