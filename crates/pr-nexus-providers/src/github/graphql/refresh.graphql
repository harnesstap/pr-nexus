query RefreshPullRequests($ids: [ID!]!) {
  rateLimit {
    limit
    remaining
    resetAt
    cost
  }
  nodes(ids: $ids) {
    ... on PullRequest {
      ...PrFields
    }
  }
}

fragment PrFields on PullRequest {
  id
  number
  title
  url
  bodyText
  isDraft
  state
  createdAt
  updatedAt
  author {
    login
  }
  headRefName
  baseRefName
  headRefOid
  repository {
    id
    owner {
      login
    }
    name
    isArchived
    defaultBranchRef {
      name
    }
  }
  labels(first: 20) {
    nodes {
      name
    }
  }
  reviewDecision
  mergeable
  mergeStateStatus
  commits(last: 1) {
    nodes {
      commit {
        committedDate
        statusCheckRollup {
          state
        }
      }
    }
  }
  reviewRequests(first: 20) {
    nodes {
      requestedReviewer {
        ... on User {
          login
          name
          avatarUrl(size: 64)
        }
        ... on Team {
          slug
          name
          avatarUrl(size: 64)
          organization {
            login
          }
        }
      }
    }
  }
  # Same queue fields as status.graphql, so a refresh does not leave a stale badge.
  isMergeQueueEnabled
  isInMergeQueue
  mergeQueue { id }
  mergeQueueEntry { position state estimatedTimeToMerge }
  timelineItems(last: 5, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT]) {
    nodes {
      __typename
      ... on RemovedFromMergeQueueEvent { reason }
    }
  }
  reviewThreads(first: 100) {
    totalCount
    nodes {
      isResolved
    }
  }
}
