query SearchPullRequests($query: String!, $first: Int!, $cursor: String) {
  rateLimit {
    limit
    remaining
    resetAt
    cost
  }
  search(type: ISSUE, query: $query, first: $first, after: $cursor) {
    issueCount
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ... on PullRequest {
        ...PrListFields
      }
    }
  }
}

# Cheap fields only. Review decision, mergeability, checks and review threads
# are slow for GitHub to compute; sync reads them with status.graphql.
fragment PrListFields on PullRequest {
  id
  number
  title
  url
  bodyText
  isDraft
  state
  createdAt
  updatedAt
  author {
    login
  }
  headRefName
  baseRefName
  headRefOid
  repository {
    id
    owner {
      login
    }
    name
    isArchived
    defaultBranchRef {
      name
    }
  }
  labels(first: 20) {
    nodes {
      name
    }
  }
  reviewRequests(first: 20) {
    nodes {
      requestedReviewer {
        ... on User {
          login
          name
          avatarUrl(size: 64)
        }
        ... on Team {
          slug
          name
          avatarUrl(size: 64)
          organization {
            login
          }
        }
      }
    }
  }
}
