query PullRequestStatus($ids: [ID!]!) {
  rateLimit {
    limit
    remaining
    resetAt
    cost
  }
  nodes(ids: $ids) {
    ... on PullRequest {
      id
      state
      updatedAt
      reviewDecision
      mergeable
      mergeStateStatus
      commits(last: 1) {
        nodes {
          commit {
            committedDate
            statusCheckRollup {
              state
              contexts(first: 100) {
                nodes {
                  __typename
                  ... on CheckRun { name status conclusion detailsUrl }
                  ... on StatusContext { context state targetUrl }
                }
              }
            }
          }
        }
      }
      reviewThreads(first: 100) {
        totalCount
        nodes {
          isResolved
        }
      }
      # isMergeQueueEnabled is GitHub's answer for branch protection
      # "Require merge queue" and a ruleset rule of type MERGE_QUEUE.
      # BranchProtectionRule has no requiresMergeQueue field, and Ref has
      # no mergeQueue field. mergeQueue is the queue for the base branch.
      isMergeQueueEnabled
      isInMergeQueue
      mergeQueue { id }
      mergeQueueEntry { position state estimatedTimeToMerge }
      timelineItems(last: 5, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT]) {
        nodes {
          __typename
          ... on RemovedFromMergeQueueEvent { reason }
        }
      }
      # Newest review requests, ready events, and submitted reviews. `last`
      # keeps the latest request when the slice is full.
      reviewClock: timelineItems(last: 40, itemTypes: [REVIEW_REQUESTED_EVENT, READY_FOR_REVIEW_EVENT, PULL_REQUEST_REVIEW]) {
        nodes {
          __typename
          ... on ReviewRequestedEvent {
            createdAt
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Bot { login }
              ... on Mannequin { login }
              ... on Team {
                slug
                organization { login }
              }
            }
          }
          ... on ReadyForReviewEvent { createdAt }
          ... on PullRequestReview {
            submittedAt
            author { __typename login }
          }
        }
      }
    }
  }
}
