query PullRequestStatus($ids: [ID!]!) {
  rateLimit {
    limit
    remaining
    resetAt
    cost
  }
  nodes(ids: $ids) {
    ... on PullRequest {
      id
      state
      updatedAt
      reviewDecision
      mergeable
      mergeStateStatus
      commits(last: 1) {
        nodes {
          commit {
            committedDate
            statusCheckRollup {
              state
            }
          }
        }
      }
      reviewThreads(first: 100) {
        totalCount
        nodes {
          isResolved
        }
      }
      # isMergeQueueEnabled is GitHub's answer for branch protection
      # "Require merge queue" and a ruleset rule of type MERGE_QUEUE.
      # BranchProtectionRule has no requiresMergeQueue field, and Ref has
      # no mergeQueue field. mergeQueue is the queue for the base branch.
      isMergeQueueEnabled
      isInMergeQueue
      mergeQueue { id }
      mergeQueueEntry { position state estimatedTimeToMerge }
      timelineItems(last: 5, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT, REMOVED_FROM_MERGE_QUEUE_EVENT]) {
        nodes {
          __typename
          ... on RemovedFromMergeQueueEvent { reason }
        }
      }
    }
  }
}
