# Supply-chain policy for the desktop app. CI runs `cargo deny check`.
[advisories]
version = 2
yanked = "deny"
# Transitive through Tauri 2.12 / tauri-plugin-opener. Each advisory says no
# fixed upgrade is available (GTK macros, and the zbus 5 crates folded into
# zbus 6). Revisit when Tauri moves off them.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via the GTK stack; no fixed release" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6; tauri-plugin-opener still uses zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6; tauri-plugin-opener still uses zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6; tauri-plugin-opener still uses zbus 5" },
]

[licenses]
version = 2
confidence-threshold = 0.8
# Workspace crates are private (publish = false) and use license = "UNLICENSED".
private = { ignore = true }
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this private workspace have no version requirement.
# They stay allowed; registry wildcards are still denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
