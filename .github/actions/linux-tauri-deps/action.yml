name: Linux Tauri dependencies
description: Install the WebKitGTK headers required to compile the Tauri shell on Ubuntu.
runs:
  using: composite
  steps:
    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          -o Dpkg::Options::=--force-confdef \
          -o Dpkg::Options::=--force-confold \
          build-essential \
          curl \
          file \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          librsvg2-dev \
          libssl-dev \
          libwebkit2gtk-4.1-dev \
          libxdo-dev \
          patchelf \
          pkg-config \
          wget
