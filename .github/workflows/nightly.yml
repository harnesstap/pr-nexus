name: Nightly

# Unlocked dependency check. CI keeps `--locked`. This workflow updates the
# lockfile in the runner only, then builds and tests. It does not open issues
# and it does not push the updated lockfile.
on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Linux jobs use the self-hosted runners (see ci.yml for LINUX_RUNNER_LABELS).

jobs:
  rust:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Build frontend
        working-directory: app
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
      - name: Update dependencies
        run: cargo update --workspace
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny --all-features check

  web:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  build-check:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: app
        run: bun run tauri build --no-bundle

  # GitHub-hosted macOS and Windows: manual runs only.
  desktop:
    if: github.event_name == 'workflow_dispatch'
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: app
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            bun run tauri build --bundles app
          else
            bun run tauri build --no-bundle
          fi
