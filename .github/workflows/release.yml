name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (default latest Changie version)
        required: false
        type: string
      dry_run:
        description: Check version and release scripts without building or publishing
        required: false
        type: boolean
        default: false
      macos_sign_dry_run:
        description: With dry_run, also build and sign the macOS app on a macOS runner (no upload, no release)
        required: false
        type: boolean
        default: false
  # Tag release pushes tags with GITHUB_TOKEN, which does not trigger a tag
  # push workflow. Run after that job succeeds.
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed

# One release at a time. A tag push and the workflow_run from Tag release can
# both fire for the same cut. Upload and publish steps are idempotent.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    permissions:
      contents: write
      actions: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Record mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_INPUT" = "true" ]; then
            dry=1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

      - name: Download Tag release result
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tag-release-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/tag-release-result

      - name: Check out tagged cut
        if: github.event_name == 'workflow_run' && steps.mode.outputs.dry_run != '1'
        run: |
          set -euo pipefail
          RESULT="/tmp/tag-release-result/result.env"
          if [ ! -f "$RESULT" ]; then
            echo "No Tag release artifact; using checkout SHA."
            exit 0
          fi
          CREATED="$(sed -n 's/^created=//p' "$RESULT")"
          TAG="$(sed -n 's/^tag=//p' "$RESULT")"
          if [ "$CREATED" != "true" ] || [ -z "$TAG" ]; then
            echo "Tag release did not create a tag; leaving checkout as-is."
            exit 0
          fi
          git fetch origin --tags
          git checkout --force "$TAG"
          echo "Checked out $TAG ($(git rev-parse HEAD))"

      - name: Latest Changie version
        id: latest
        if: steps.mode.outputs.dry_run != '1'
        continue-on-error: true
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Resolve tag and draft release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          CHANGIE_LATEST: ${{ steps.latest.outputs.output }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TAG_RELEASE_RESULT: /tmp/tag-release-result/result.env
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/prepare-release.sh

  macos:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build macOS app and DMG
        working-directory: app
        run: bun run tauri build --bundles app,dmg

      # Dormant until APPLE_CERTIFICATE is configured. v1 does not sign with a
      # Developer ID; filling this step in later should not restructure the job.
      - name: Developer ID signing
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "Developer ID signing is not implemented yet."
          echo "v1 reseals with an ad-hoc signature. Replace this step before setting APPLE_CERTIFICATE."
          exit 1

      # No Developer ID: sign with the stable self-signed release cert so the
      # designated requirement (identifier + leaf cert) survives updates and
      # the keychain "Always Allow" sticks. Gatekeeper still warns.
      - name: Import self-signed release cert
        if: env.APPLE_CERTIFICATE == '' && env.MACOS_SELFSIGN_P12_BASE64 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/selfsign.p12"
          printf '%s' "$MACOS_SELFSIGN_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/PR Nexus Release/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "Release identity not found in temporary keychain." >&2
            security find-identity -p codesigning "$KC" || true
            exit 1
          fi
          echo "RESEAL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "RESEAL_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Signs with RESEAL_IDENTITY when the step above set it, else ad-hoc.
      # Either way the DMG is rebuilt from the signed app.
      - name: Sign (self-signed or ad-hoc) and rebuild DMG
        if: env.APPLE_CERTIFICATE == ''
        env:
          RESEAL_REQUIRE: "1"
        run: bash scripts/reseal-macos-app.sh "${CARGO_TARGET_DIR}/release/bundle"

      - name: Delete temporary keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          if [ -f "$KC" ]; then security delete-keychain "$KC" || true; fi
          rm -f "$RUNNER_TEMP/selfsign.p12"

      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${CARGO_TARGET_DIR}/release/bundle/dmg/"*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DMG produced."
            find "${CARGO_TARGET_DIR}/release/bundle" -type f || true
            exit 1
          fi
          # Stable, space-free asset names: "PR Nexus_<ver>_aarch64.dmg" becomes
          # "PR-Nexus_<ver>_aarch64.dmg" (the reseal step already does this).
          assets=()
          for file in "${files[@]}"; do
            stable="$(dirname "$file")/$(basename "$file" | tr ' ' '-')"
            if [ "$file" != "$stable" ]; then
              mv "$file" "$stable"
            fi
            assets+=("$stable")
          done
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded ${assets[*]} to $TAG"

  macos-sign-dry-run:
    # Exercise build + signing without a tag, upload or release.
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.macos_sign_dry_run
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build macOS app and DMG
        working-directory: app
        run: bun run tauri build --bundles app,dmg

      # Dormant until APPLE_CERTIFICATE is configured. v1 does not sign with a
      # Developer ID; filling this step in later should not restructure the job.
      - name: Developer ID signing
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "Developer ID signing is not implemented yet."
          echo "v1 reseals with an ad-hoc signature. Replace this step before setting APPLE_CERTIFICATE."
          exit 1

      # No Developer ID: sign with the stable self-signed release cert so the
      # designated requirement (identifier + leaf cert) survives updates and
      # the keychain "Always Allow" sticks. Gatekeeper still warns.
      - name: Import self-signed release cert
        if: env.APPLE_CERTIFICATE == '' && env.MACOS_SELFSIGN_P12_BASE64 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/selfsign.p12"
          printf '%s' "$MACOS_SELFSIGN_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/PR Nexus Release/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "Release identity not found in temporary keychain." >&2
            security find-identity -p codesigning "$KC" || true
            exit 1
          fi
          echo "RESEAL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "RESEAL_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Signs with RESEAL_IDENTITY when the step above set it, else ad-hoc.
      # Either way the DMG is rebuilt from the signed app.
      - name: Sign (self-signed or ad-hoc) and rebuild DMG
        if: env.APPLE_CERTIFICATE == ''
        env:
          RESEAL_REQUIRE: "1"
        run: bash scripts/reseal-macos-app.sh "${CARGO_TARGET_DIR}/release/bundle"

      - name: Delete temporary keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          if [ -f "$KC" ]; then security delete-keychain "$KC" || true; fi
          rm -f "$RUNNER_TEMP/selfsign.p12"

      - name: Inspect signature
        run: |
          set -euo pipefail
          APP="${CARGO_TARGET_DIR}/release/bundle/macos/PR Nexus.app"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign -d -r- "$APP" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls -la "${CARGO_TARGET_DIR}/release/bundle/dmg/"

  publish:
    needs:
      - prepare
      - macos
    if: needs.prepare.result == 'success' && needs.macos.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    permissions:
      contents: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7

      - name: Verify the DMG and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          mapfile -t names < <(jq -r '.assets[].name' <<<"$INFO")
          bash scripts/check-release-assets.sh "${TAG#v}" "${names[@]}"
          if [ "$(jq -r .isDraft <<<"$INFO")" != "true" ]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          HIGHEST="$(
            {
              gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName --jq '.[].tagName'
              echo "$TAG"
            } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          )"
          if [ "$HIGHEST" = "$TAG" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "Published $TAG (latest=true)."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            echo "Published $TAG (latest=false, highest is $HIGHEST)."
          fi

  # Bumps Casks/pr-nexus.rb in harnesstap/homebrew-tap. Skips cleanly when the
  # tap GitHub App credentials (HOMEBREW_TAP_APP_CLIENT_ID variable,
  # HOMEBREW_TAP_APP_PRIVATE_KEY secret) are absent. Runs after the release is
  # public, so a tap failure never blocks publishing.
  homebrew-tap:
    name: update Homebrew tap
    needs:
      - prepare
      - publish
    if: needs.publish.result == 'success' && needs.prepare.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
