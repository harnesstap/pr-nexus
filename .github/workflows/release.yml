name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (default latest Changie version)
        required: false
        type: string
      dry_run:
        description: Check version and release scripts without building or publishing
        required: false
        type: boolean
        default: false
      macos_sign_dry_run:
        description: With dry_run, also build and sign the macOS app on a macOS runner (no upload, no release)
        required: false
        type: boolean
        default: false
      platform_build_dry_run:
        description: With dry_run, also build and smoke-test the Linux and Windows installers (kept as workflow artifacts, no release)
        required: false
        type: boolean
        default: false
  # Tag release pushes tags with GITHUB_TOKEN, which does not trigger a tag
  # push workflow. Run after that job succeeds.
  workflow_run:
    workflows:
      - Tag release
    types:
      - completed

# One release at a time. A tag push and the workflow_run from Tag release can
# both fire for the same cut. Upload and publish steps are idempotent.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    permissions:
      contents: write
      actions: read
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Fetch tags
        run: git fetch origin --tags

      - name: Record mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_INPUT" = "true" ]; then
            dry=1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

      - name: Download Tag release result
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: tag-release-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/tag-release-result

      - name: Check out tagged cut
        if: github.event_name == 'workflow_run' && steps.mode.outputs.dry_run != '1'
        run: |
          set -euo pipefail
          RESULT="/tmp/tag-release-result/result.env"
          if [ ! -f "$RESULT" ]; then
            echo "No Tag release artifact; using checkout SHA."
            exit 0
          fi
          CREATED="$(sed -n 's/^created=//p' "$RESULT")"
          TAG="$(sed -n 's/^tag=//p' "$RESULT")"
          if [ "$CREATED" != "true" ] || [ -z "$TAG" ]; then
            echo "Tag release did not create a tag; leaving checkout as-is."
            exit 0
          fi
          git fetch origin --tags
          git checkout --force "$TAG"
          echo "Checked out $TAG ($(git rev-parse HEAD))"

      - name: Latest Changie version
        id: latest
        if: steps.mode.outputs.dry_run != '1'
        continue-on-error: true
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Resolve tag and draft release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          CHANGIE_LATEST: ${{ steps.latest.outputs.output }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          TAG_RELEASE_RESULT: /tmp/tag-release-result/result.env
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/prepare-release.sh

  macos:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.dry_run != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build macOS app and DMG
        working-directory: app
        run: bun run tauri build --bundles app,dmg

      # Dormant until APPLE_CERTIFICATE is configured. v1 does not sign with a
      # Developer ID; filling this step in later should not restructure the job.
      - name: Developer ID signing
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "Developer ID signing is not implemented yet."
          echo "v1 reseals with an ad-hoc signature. Replace this step before setting APPLE_CERTIFICATE."
          exit 1

      # No Developer ID: sign with the stable self-signed release cert so the
      # designated requirement (identifier + leaf cert) survives updates and
      # the keychain "Always Allow" sticks. Gatekeeper still warns.
      - name: Import self-signed release cert
        if: env.APPLE_CERTIFICATE == '' && env.MACOS_SELFSIGN_P12_BASE64 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/selfsign.p12"
          printf '%s' "$MACOS_SELFSIGN_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # The keychain list is split into one argument per keychain on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/PR Nexus Release/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "Release identity not found in temporary keychain." >&2
            security find-identity -p codesigning "$KC" || true
            exit 1
          fi
          echo "RESEAL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "RESEAL_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Signs with RESEAL_IDENTITY when the step above set it, else ad-hoc.
      # Either way the DMG is rebuilt from the signed app.
      - name: Sign (self-signed or ad-hoc) and rebuild DMG
        if: env.APPLE_CERTIFICATE == ''
        env:
          RESEAL_REQUIRE: "1"
        run: bash scripts/reseal-macos-app.sh "${CARGO_TARGET_DIR}/release/bundle"

      - name: Delete temporary keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          if [ -f "$KC" ]; then security delete-keychain "$KC" || true; fi
          rm -f "$RUNNER_TEMP/selfsign.p12"

      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${CARGO_TARGET_DIR}/release/bundle/dmg/"*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DMG produced."
            find "${CARGO_TARGET_DIR}/release/bundle" -type f || true
            exit 1
          fi
          # Stable, space-free asset names: "PR Nexus_<ver>_aarch64.dmg" becomes
          # "PR-Nexus_<ver>_aarch64.dmg" (the reseal step already does this).
          assets=()
          for file in "${files[@]}"; do
            stable="$(dirname "$file")/$(basename "$file" | tr ' ' '-')"
            if [ "$file" != "$stable" ]; then
              mv "$file" "$stable"
            fi
            assets+=("$stable")
          done
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Uploaded ${assets[*]} to $TAG"

  macos-sign-dry-run:
    # Exercise build + signing without a tag, upload or release.
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.macos_sign_dry_run
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_SELFSIGN_P12_BASE64: ${{ secrets.MACOS_SELFSIGN_P12_BASE64 }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build macOS app and DMG
        working-directory: app
        run: bun run tauri build --bundles app,dmg

      # Dormant until APPLE_CERTIFICATE is configured. v1 does not sign with a
      # Developer ID; filling this step in later should not restructure the job.
      - name: Developer ID signing
        if: env.APPLE_CERTIFICATE != ''
        run: |
          echo "Developer ID signing is not implemented yet."
          echo "v1 reseals with an ad-hoc signature. Replace this step before setting APPLE_CERTIFICATE."
          exit 1

      # No Developer ID: sign with the stable self-signed release cert so the
      # designated requirement (identifier + leaf cert) survives updates and
      # the keychain "Always Allow" sticks. Gatekeeper still warns.
      - name: Import self-signed release cert
        if: env.APPLE_CERTIFICATE == '' && env.MACOS_SELFSIGN_P12_BASE64 != ''
        env:
          P12_PASSWORD: ${{ secrets.MACOS_SELFSIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          P12="$RUNNER_TEMP/selfsign.p12"
          printf '%s' "$MACOS_SELFSIGN_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          # The keychain list is split into one argument per keychain on purpose.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -p codesigning "$KC" | awk '/PR Nexus Release/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "Release identity not found in temporary keychain." >&2
            security find-identity -p codesigning "$KC" || true
            exit 1
          fi
          echo "RESEAL_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "RESEAL_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Signs with RESEAL_IDENTITY when the step above set it, else ad-hoc.
      # Either way the DMG is rebuilt from the signed app.
      - name: Sign (self-signed or ad-hoc) and rebuild DMG
        if: env.APPLE_CERTIFICATE == ''
        env:
          RESEAL_REQUIRE: "1"
        run: bash scripts/reseal-macos-app.sh "${CARGO_TARGET_DIR}/release/bundle"

      - name: Delete temporary keychain
        if: always()
        run: |
          KC="$RUNNER_TEMP/pr-nexus-sign.keychain-db"
          if [ -f "$KC" ]; then security delete-keychain "$KC" || true; fi
          rm -f "$RUNNER_TEMP/selfsign.p12"

      - name: Inspect signature
        run: |
          set -euo pipefail
          APP="${CARGO_TARGET_DIR}/release/bundle/macos/PR Nexus.app"
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign -d -r- "$APP" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP"
          ls -la "${CARGO_TARGET_DIR}/release/bundle/dmg/"

  # Linux installers (AppImage, deb, rpm) on GitHub-hosted runners, x86_64 and
  # arm64. The shared self-hosted runners never install system packages, and
  # the smoke test needs apt + xvfb. Dry run (platform_build_dry_run) builds and
  # smoke-tests without a tag and keeps the files as workflow artifacts.
  linux:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && (
        (needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.dry_run != 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.platform_build_dry_run)
      )
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - uses: ./.github/actions/linux-tauri-deps

      - name: Install packaging and smoke-test tools
        run: sudo apt-get install -y --no-install-recommends xvfb xauth rpm libfuse2t64 || sudo apt-get install -y --no-install-recommends xvfb xauth rpm libfuse2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: release-linux-${{ matrix.arch }}

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build AppImage, deb and rpm
        working-directory: app
        run: bun run tauri build --bundles appimage,deb,rpm

      - name: Stable asset names
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          for file in "$CARGO_TARGET_DIR"/release/bundle/{appimage/*.AppImage,deb/*.deb,rpm/*.rpm}; do
            cp "$file" "$out/$(basename "$file" | tr ' ' '-')"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke-launch the packaged app
        run: bash scripts/smoke-linux.sh "$CARGO_TARGET_DIR/release/bundle" 15

      - name: Keep dry-run installers
        if: needs.prepare.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ steps.assets.outputs.dir }}
          retention-days: 7

      - name: Upload installers
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.assets.outputs.dir }}"/* --clobber --repo "$GITHUB_REPOSITORY"

  # Windows installers (NSIS setup.exe and MSI), unsigned for now.
  windows:
    needs: prepare
    if: >-
      needs.prepare.result == 'success' && (
        (needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.dry_run != 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.platform_build_dry_run)
      )
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: release-windows

      - name: Install dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Build NSIS and MSI installers
        working-directory: app
        run: bun run tauri build --bundles nsis,msi

      - name: Stable asset names
        id: assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          out="$RUNNER_TEMP/assets"
          mkdir -p "$out"
          for file in "$CARGO_TARGET_DIR"/release/bundle/{nsis/*-setup.exe,msi/*.msi}; do
            cp "$file" "$out/$(basename "$file" | tr ' ' '-')"
          done
          ls -l "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke-launch the installed app
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 -Bundle "$env:CARGO_TARGET_DIR/release/bundle" -Seconds 15

      - name: Keep dry-run installers
        if: needs.prepare.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: ${{ steps.assets.outputs.dir }}
          retention-days: 7

      - name: Upload installers
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" "${{ steps.assets.outputs.dir }}"/* --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs:
      - prepare
      - macos
      - linux
      - windows
    if: needs.prepare.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    permissions:
      contents: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7

      - name: Verify installers, add SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"
          mapfile -t names < <(jq -r '.assets[].name' <<<"$INFO")
          bash scripts/check-release-assets.sh "${TAG#v}" "${names[@]}"
          # SHA256SUMS over every installer, for scripts/install.sh and manual checks.
          dl="$(mktemp -d)"
          mapfile -t expected < <(bash scripts/check-release-assets.sh --list "${TAG#v}")
          for name in "${expected[@]}"; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$dl"
          done
          (cd "$dl" && sha256sum "${expected[@]}" > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" "$dl/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          if [ "$(jq -r .isDraft <<<"$INFO")" != "true" ]; then
            echo "Release $TAG is already published."
            exit 0
          fi
          HIGHEST="$(
            {
              gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 200 --json tagName --jq '.[].tagName'
              echo "$TAG"
            } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          )"
          if [ "$HIGHEST" = "$TAG" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            echo "Published $TAG (latest=true)."
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
            echo "Published $TAG (latest=false, highest is $HIGHEST)."
          fi

  # Bumps Casks/pr-nexus.rb in harnesstap/homebrew-tap. Skips cleanly when the
  # tap GitHub App credentials (HOMEBREW_TAP_APP_CLIENT_ID variable,
  # HOMEBREW_TAP_APP_PRIVATE_KEY secret) are absent. Runs after the release is
  # public, so a tap failure never blocks publishing.
  homebrew-tap:
    name: update Homebrew tap
    needs:
      - prepare
      - publish
    if: needs.publish.result == 'success' && needs.prepare.outputs.skip != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}

  # Renders the WinGet manifests (packaging/winget) for the published tag and
  # keeps them as an artifact. Submitting to microsoft/winget-pkgs with komac
  # runs only when the WINGET_TOKEN secret exists (it does not yet), so this
  # never opens a winget-pkgs pull request on its own.
  winget:
    needs:
      - prepare
      - publish
    if: needs.publish.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check out scripts
        uses: actions/checkout@v7

      - name: Render manifests
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          bash scripts/render-winget-manifests.sh "$TAG" "$RUNNER_TEMP/SHA256SUMS" "$RUNNER_TEMP/winget"

      - name: Keep manifests
        uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget
          retention-days: 30

      - name: Submit to winget-pkgs
        if: env.WINGET_TOKEN != ''
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          curl -fsSL -o "$RUNNER_TEMP/komac.deb" "https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac_2.17.1-1_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/komac.deb"
          komac update harnesstap.PRNexus --version "$version" \
            --urls "$base/PR-Nexus_${version}_x64-setup.exe" "$base/PR-Nexus_${version}_x64_en-US.msi" \
            --token "$WINGET_TOKEN" --submit

      - name: Note skipped submission
        if: env.WINGET_TOKEN == ''
        run: echo "::notice::WINGET_TOKEN is not set; WinGet manifests were rendered but not submitted."
