name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      locked:
        description: Check Cargo.lock with --locked
        type: boolean
        default: true
      full:
        description: Run every job, ignoring path filters
        type: boolean
        default: true
  workflow_call:
    inputs:
      locked:
        description: Check Cargo.lock with --locked
        type: boolean
        default: true
      full:
        description: Run every job, ignoring path filters
        type: boolean
        default: false

# Least privilege. pull-requests:read lets the merge queue see the no-changelog label.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      web: ${{ steps.decide.outputs.web }}
      ci: ${{ steps.decide.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect changed paths
        id: filter
        if: inputs.full != true && github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - 'crates/**'
              - 'app/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            web:
              - 'app/**'
              - '!app/src-tauri/**'
            ci:
              - '.github/**'
              - 'scripts/**'
      - name: Decide which jobs are needed
        id: decide
        env:
          FULL: ${{ inputs.full }}
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail
          if [[ "${FULL}" == "true" || "${EVENT_NAME}" == "schedule" ]]; then
            {
              echo "rust=true"
              echo "web=true"
              echo "ci=true"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "rust=${FILTER_RUST:-false}"
              echo "web=${FILTER_WEB:-false}"
              echo "ci=${FILTER_CI:-false}"
            } >> "${GITHUB_OUTPUT}"
          fi

  rust-lint:
    name: rust-lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: ./scripts/install-linux-deps.sh
      - name: Update dependencies
        if: inputs.locked == false
        run: cargo update --workspace
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        if: inputs.locked != false
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy against updated dependencies
        if: inputs.locked == false
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Verify Cargo.lock
        if: inputs.locked != false
        run: cargo update --workspace --locked

  rust-test:
    name: rust-test
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - name: Update dependencies
        if: inputs.locked == false
        run: cargo update --workspace
      - name: Test
        shell: bash
        env:
          LOCKED: ${{ inputs.locked }}
        run: |
          set -euo pipefail
          args=(test --workspace)
          if [[ "${LOCKED}" != "false" ]]; then
            args+=(--locked)
          fi
          # Linux runners have no secret service. The feature is a stub until
          # the keyring vault lands; CI already passes the flag the spec names.
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            args+=(--features keyring-mock)
          fi
          cargo "${args[@]}"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install, lint, typecheck, and test
        working-directory: app
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test

  build-check:
    name: build-check
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # An .app only exists once the bundle step runs. Linux and Windows
          # stay on --no-bundle; they are not shipped.
          - os: macos-latest
            bundles: app
            upload_app: true
          - os: ubuntu-24.04
            bundles: none
            upload_app: false
          - os: windows-latest
            bundles: none
            upload_app: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: ./scripts/install-linux-deps.sh
      - name: Build the desktop shell
        shell: bash
        working-directory: app
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          if [[ "${BUNDLES}" == "app" ]]; then
            bun run tauri build --bundles app
          else
            bun run tauri build --no-bundle
          fi
      - name: Upload macOS app
        if: matrix.upload_app
        uses: actions/upload-artifact@v7
        with:
          name: pr-nexus-macos-app
          path: target/release/bundle/macos/PR-Nexus.app
          retention-days: 7
          if-no-files-found: error

  deny:
    name: deny
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Update dependencies
        if: inputs.locked == false
        run: cargo update --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # cargo-deny 0.20 rejects the action default `--all-features` (it is
          # placed before the subcommand). `--workspace` is a valid global flag.
          arguments: "--workspace"

  guards:
    name: guards
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sudo tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          actionlint -version
      - name: Lint workflows
        run: actionlint -color
      - name: Lint scripts
        run: shellcheck scripts/*.sh
      - name: Test release scripts
        run: |
          ./scripts/test-stamp.sh
          ./scripts/test-resolve-release-tag.sh
      - name: Require a changelog fragment
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, '\n') }}
        run: ./scripts/check-changelog.sh
      - name: Install changie
        run: ./scripts/install-changie.sh
      - name: Check Changie fragments
        run: |
          set -euo pipefail
          shopt -s nullglob
          fragments=(.changes/unreleased/*.yaml .changes/unreleased/*.yml)
          if [[ ${#fragments[@]} -eq 0 ]]; then
            echo "no unreleased fragments to batch"
            exit 0
          fi
          changie batch auto --dry-run

  validate:
    name: validate
    needs: [changes, rust-lint, rust-test, web, build-check, deny, guards]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail when a needed job failed or was cancelled
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python3 - << 'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = []
          for name, info in needs.items():
              result = info.get("result")
              print(f"{name}: {result}")
              if result in {"failure", "cancelled"}:
                  bad.append(f"{name}={result}")
          if bad:
              print("needed jobs failed or were cancelled: " + ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
