name: CI

on:
  push:
    branches:
      - main
    # Release tags also run the macOS and Windows jobs below.
    tags:
      - "v*"
  pull_request:
  # Merge queue builds gh-readonly-queue/* and fires merge_group instead of
  # pull_request. Job names stay the same, so the required `validate` check
  # reports for the queue. Jobs skipped by path filters still pass.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Linux jobs run on the org's self-hosted runners. Set the repository variable
# LINUX_RUNNER_LABELS to a JSON array (for example ["self-hosted","Linux","X64"])
# to target other labels without editing this file. macOS and Windows jobs use
# GitHub-hosted runners and only run for release tags and manual dispatch.
#
# The repository is public. Pull requests from forks run untrusted code, so
# their Linux jobs go to GitHub-hosted ubuntu-latest and never reach the shared
# self-hosted runners. Never switch this workflow to pull_request_target.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    outputs:
      rust: ${{ steps.resolve.outputs.rust }}
      web: ${{ steps.resolve.outputs.web }}
      ci: ${{ steps.resolve.outputs.ci }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect changed paths
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            rust:
              - 'crates/**'
              - 'app/src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
            web:
              - 'app/**'
              - '!app/src-tauri/**'
              - 'scripts/**'
            ci:
              - '.github/**'
              - 'scripts/**'

      - name: Resolve change flags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_RUST: ${{ steps.filter.outputs.rust }}
          FILTER_WEB: ${{ steps.filter.outputs.web }}
          FILTER_CI: ${{ steps.filter.outputs.ci }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "rust=true"
              echo "web=true"
              echo "ci=true"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "rust=${FILTER_RUST}"
              echo "web=${FILTER_WEB}"
              echo "ci=${FILTER_CI}"
            } >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Vite and vitest run on Node. Pin it: a self-hosted image may ship an old one.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Persistent bun cache (CI_CACHE_DIR)
        if: runner.environment != 'github-hosted' && vars.CI_CACHE_DIR != ''
        uses: ./.github/actions/persistent-cache
        with:
          root: ${{ vars.CI_CACHE_DIR }}
          max-gb: ${{ vars.CI_CACHE_MAX_GB }}
          rust: "false"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  # One Rust job: fmt, clippy, tests and the desktop build share one target
  # dir, instead of three jobs that each restored a cache and compiled the
  # workspace. The runner containers start each job from a clean filesystem,
  # so by default dependencies come from Swatinem/rust-cache. It saves only on
  # a key miss (Cargo.lock, toolchain or env change), not on every run.
  # If the repository variable CI_CACHE_DIR names a directory that persists
  # across jobs (a volume mounted into the runner), the target dir lives there
  # instead and builds are fully incremental; see
  # .github/actions/persistent-cache.
  rust:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # Web-only changes skip lint and tests; they only need the app build.
      # Not named CARGO_* or RUST_*: rust-cache hashes those into its key, and
      # a per-PR value would split the cache.
      LINT_AND_TEST: ${{ needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true' }}
      # Smaller debug info: faster compile and link, panics keep line numbers.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-tauri-deps
      - uses: dtolnay/rust-toolchain@stable
      - name: Runner resources
        run: |
          echo "nproc=$(nproc) load=$(cut -d' ' -f1-3 /proc/loadavg)"
          echo "cpu.max=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || echo n/a) memory.max=$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          free -m | sed -n 2p
          df -h "$GITHUB_WORKSPACE" | tail -1
          for l in mold ld.lld clang; do printf '%s: %s\n' "$l" "$(command -v "$l" || echo missing)"; done
      - name: Persistent build cache (CI_CACHE_DIR)
        id: pcache
        if: runner.environment != 'github-hosted' && vars.CI_CACHE_DIR != ''
        uses: ./.github/actions/persistent-cache
        with:
          root: ${{ vars.CI_CACHE_DIR }}
          max-gb: ${{ vars.CI_CACHE_MAX_GB }}
      # Fallback when no persistent volume is usable. Only main saves: PR runs
      # can read main's cache, but a cache saved by a PR is only visible to
      # that PR and pushes others out of the repository's 10 GB quota.
      - name: GitHub cache
        if: steps.pcache.outputs.enabled != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          shared-key: linux-rust
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'ci/cache-tuning' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Vite and vitest run on Node. Pin it: a self-hosted image may ship an old one.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: taiki-e/install-action@v2
        if: env.LINT_AND_TEST == 'true'
        with:
          tool: cargo-nextest
      # tauri-build embeds app/dist. Cargo does not run the frontend build.
      - name: Build frontend
        working-directory: app
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build
      - name: Format
        if: env.LINT_AND_TEST == 'true'
        run: cargo fmt --all --check
      - name: Lockfile is current
        if: env.LINT_AND_TEST == 'true'
        run: cargo update --workspace --locked
      - name: Clippy
        if: env.LINT_AND_TEST == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest runs each test binary in parallel; it does not run doctests.
      - name: Test
        if: env.LINT_AND_TEST == 'true'
        run: |
          set -euo pipefail
          cargo nextest run --workspace --locked --no-fail-fast
          cargo test --workspace --locked --doc
      # Proves the app links with the embedded frontend. The debug profile
      # reuses the test build's dependencies; nightly and release build
      # --release.
      - name: Build
        working-directory: app
        run: bun run tauri build --debug --no-bundle
      - name: Cache size
        if: always() && steps.pcache.outputs.enabled == 'true'
        run: du -sh "$CARGO_TARGET_DIR" "$BUN_INSTALL_CACHE_DIR" || true

  # GitHub-hosted macOS and Windows: release tags and manual runs only. macOS
  # also runs the test suite and builds the .app so CI can upload it.
  desktop:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      # Vite and vitest run on Node. Pin it: a self-hosted image may ship an old one.
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile
      - name: Test
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          (cd app && bun run build)
          cargo test --workspace --locked
      # `tauri build --no-bundle` does not produce a bundle, so macOS builds
      # the .app explicitly.
      - name: Build
        working-directory: app
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            bun run tauri build --bundles app
          else
            bun run tauri build --no-bundle
          fi
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: pr-nexus-macos-app
          path: target/release/bundle/macos/PR Nexus.app
          retention-days: 7
          if-no-files-found: error

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # cargo deny reads `cargo metadata`; self-hosted runners have no cargo on
      # PATH until the toolchain step adds the per-user rustup install.
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny-action is a Docker action. A prebuilt binary in the job's
      # tool path needs no Docker on the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20
      - name: cargo deny
        run: cargo deny --all-features check

  guards:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # rhysd/actionlint is a Docker action. The self-hosted runner itself runs
      # in a container, so its bind mounts do not see the workspace.
      # The binary goes to RUNNER_TEMP, which the runner wipes after the job.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            | bash -s -- "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

      - name: Require a Changie fragment
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^\.changes/unreleased/.+\.ya?ml$'; then
            echo "Changie fragment present."
            exit 0
          fi
          echo "Add a fragment under .changes/unreleased/, or label the PR no-changelog."
          exit 1

  validate:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    needs:
      - changes
      - rust
      - web
      - desktop
      - deny
      - guards
    if: always()
    steps:
      - name: Fail if a needed job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          CHANGES_RUST: ${{ needs.changes.outputs.rust }}
          CHANGES_WEB: ${{ needs.changes.outputs.web }}
          CHANGES_CI: ${{ needs.changes.outputs.ci }}
          RUST: ${{ needs.rust.result }}
          WEB: ${{ needs.web.result }}
          DESKTOP: ${{ needs.desktop.result }}
          DESKTOP_EXPECTED: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
          DENY: ${{ needs.deny.result }}
          GUARDS: ${{ needs.guards.result }}
        run: |
          set -euo pipefail
          failed=0
          should_run() {
            local job="$1"
            shift
            if [ "$CHANGES" != "success" ]; then
              echo "$job should have run (changes=$CHANGES)"
              return 0
            fi
            local flag
            for flag in "$@"; do
              if [ "$flag" = "true" ]; then
                return 0
              fi
            done
            return 1
          }
          check_required() {
            local job="$1"
            local result="$2"
            shift 2
            if should_run "$job" "$@"; then
              if [ "$result" != "success" ]; then
                echo "::error::$job is required but result is $result"
                failed=1
              fi
            elif [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::$job $result"
              failed=1
            fi
          }
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes is required but result is $CHANGES"
            failed=1
          fi
          check_required rust "$RUST" "$CHANGES_RUST" "$CHANGES_WEB" "$CHANGES_CI"
          check_required web "$WEB" "$CHANGES_WEB" "$CHANGES_CI"
          check_required desktop "$DESKTOP" "$DESKTOP_EXPECTED"
          check_required deny "$DENY" "$CHANGES_RUST" "$CHANGES_CI"
          check_required guards "$GUARDS" "true"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
