name: Tag release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Batch and stamp without committing or pushing a tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ${{ fromJSON(vars.LINUX_RUNNER_LABELS || '["self-hosted","Linux"]') }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          dry=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_INPUT" = "true" ]; then
            dry=1
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"

      - name: Require main
        if: steps.mode.outputs.dry_run != '1'
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Tag release only cuts from main (ref is ${GITHUB_REF})."
            exit 1
          fi

      - name: Latest Changie version
        id: latest
        continue-on-error: true
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Plan release cut
        id: plan
        env:
          CHANGIE_LATEST: ${{ steps.latest.outputs.output }}
        run: bash scripts/tag-release-plan.sh

      - name: Batch unreleased changes
        if: steps.plan.outputs.has_unreleased == 'true'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: batch ${{ steps.plan.outputs.batch_args }}

      - name: Merge changelog
        if: steps.plan.outputs.has_unreleased == 'true'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: merge

      - name: Refresh latest version after batch
        id: batched
        if: steps.plan.outputs.action == 'prepare'
        uses: miniscruff/changie-action@v3
        with:
          version: latest
          args: latest

      - name: Install Rust
        if: steps.plan.outputs.action == 'prepare'
        uses: dtolnay/rust-toolchain@stable

      - name: Stamp workspace version
        if: steps.plan.outputs.action == 'prepare'
        env:
          TAG: ${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}
        run: |
          set -euo pipefail
          if [ -z "${TAG}" ]; then
            echo "No Changie version to stamp."
            exit 1
          fi
          bash scripts/stamp-release-version.sh "${TAG}"

      - name: Check stamped Cargo.lock is current
        if: steps.plan.outputs.action == 'prepare'
        run: cargo update --workspace --locked

      - name: Commit release files
        if: steps.plan.outputs.action == 'prepare' && steps.mode.outputs.dry_run != '1'
        env:
          TAG: ${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .changes Cargo.toml Cargo.lock app/package.json
          if git diff --cached --quiet; then
            echo "No version files to commit."
            exit 0
          fi
          git commit -m "Release ${TAG}"
          git push origin HEAD:main

      - name: Create and push tag if missing
        id: tag
        if: >-
          (steps.plan.outputs.action == 'prepare' || steps.plan.outputs.action == 'tag') &&
          steps.mode.outputs.dry_run != '1'
        env:
          TAG: ${{ steps.batched.outputs.output || steps.plan.outputs.batched_version }}
        run: |
          set -euo pipefail
          created=false
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ -z "$TAG" ] || [ "$TAG" = "v0.0.0" ] || [ "$TAG" = "0.0.0" ] || [ ! -f ".changes/${TAG}.md" ]; then
            echo "No batched changelog for ${TAG:-<empty>}; skipping tag."
            echo "created=${created}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin --tags
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; skipping."
            echo "created=${created}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          created=true
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - name: Write tag-release result
        if: always()
        env:
          CREATED: ${{ steps.tag.outputs.created || 'false' }}
          TAG: ${{ steps.tag.outputs.tag || steps.batched.outputs.output || '' }}
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tag-release-result
          {
            echo "created=${CREATED}"
            echo "tag=${TAG}"
            echo "dry_run=${DRY_RUN}"
          } > /tmp/tag-release-result/result.env

      - name: Upload tag-release result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tag-release-result
          path: /tmp/tag-release-result/result.env
          retention-days: 7
