[package]
name = "pr-nexus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "PR Nexus desktop shell"

[lib]
name = "pr_nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
pr-nexus-core = { path = "../../crates/pr-nexus-core" }
pr-nexus-providers = { path = "../../crates/pr-nexus-providers" }
chrono.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Local MCP server (Streamable HTTP on 127.0.0.1), see src/mcp.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rand = "0.10"
base64 = "0.22"
hmac = "0.13"
regex = "1.13"
sha2 = "0.11"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "1"
subtle = "2.6"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
pr-nexus-core = { path = "../../crates/pr-nexus-core", features = ["test-support"] }
tempfile = "3"
