changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
versionHeaderPath: ""
changelogPath: CHANGELOG.md
versionExt: md
envPrefix: CHANGIE_
versionFormat: '## {{.Version}} - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '- {{.Body}}'
kinds:
  - label: Breaking
    auto: major
  - label: Features
    auto: minor
  - label: Added
    auto: minor
  - label: Changed
    auto: patch
  - label: Fixes
    auto: patch
  - label: Fixed
    auto: patch
  - label: Docs
    auto: patch
  - label: Dependencies
    auto: patch
newlines:
  afterChangelogHeader: 1
  afterKind: 1
  afterChangelogVersion: 1
  beforeKind: 1
  endOfVersion: 1
